<!doctype html><html><head><meta charset="utf-8"><title>tools</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>body{font-family:monospace;background:#111;color:#ddd;padding:16px}
textarea{width:100%;height:70px;font-size:9px}img,canvas{background:#333;margin:4px;vertical-align:top}
h3{color:#4cf;margin:18px 0 4px}</style></head><body>
<h1>Herramientas CULTURA SETP</h1>
<div id="log">cargando…</div>

<h3>1 · Fotos recortadas 3:2 (900×600)</h3>
<div id="crops"></div>

<h3>2 · Bus animado (GIF)</h3>
<div id="busout"></div>

<script>
const log = m => { document.getElementById('log').textContent = m; };

/* ---------- 1. recortar fotos a 3:2 ---------- */
async function crop(src, w, h){
  const im = new Image(); im.crossOrigin='anonymous';
  await new Promise((ok,err)=>{ im.onload=ok; im.onerror=err; im.src=src; });
  const targetRatio = w/h;
  let sw = im.naturalWidth, sh = im.naturalHeight;
  let cw = sw, ch = sw/targetRatio;
  if (ch > sh) { ch = sh; cw = sh*targetRatio; }
  const sx = (sw-cw)/2, sy = (sh-ch)/2;
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(im, sx, sy, cw, ch, 0, 0, w, h);
  return c.toDataURL('image/jpeg', 0.82);
}
(async () => {
  const out = document.getElementById('crops');
  for (const name of ['correo-1.jpg','correo-2.jpg','correo-3.jpg']) {
    try {
      const d = await crop('img/'+name+'?v='+Date.now(), 900, 600);
      const wrap = document.createElement('div');
      wrap.innerHTML = '<div>'+name+' ('+Math.round(d.length/1024)+' KB b64)</div>'+
        '<img src="'+d+'" width="200"><textarea>'+d+'</textarea>';
      out.appendChild(wrap);
      window['CROP_'+name.replace(/\W/g,'_')] = d;
    } catch(e){ out.appendChild(Object.assign(document.createElement('div'),{textContent:name+' ERROR: '+e})); }
  }
  log('fotos listas');
  makeBus();
})();

/* ---------- 2. GIF del bus ---------- */
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

var PERIOD = 342;  // 9 × 38 (dash 22+16) → vía en loop perfecto
function scene(ctx, off, spin){
  const W = ctx.canvas.width, H = ctx.canvas.height;
  ctx.fillStyle = '#EEF3FA'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#3A4256'; ctx.fillRect(0, H-22, W, 22);
  ctx.strokeStyle = '#F2C94C'; ctx.lineWidth = 3; ctx.setLineDash([22,16]);
  ctx.lineDashOffset = -off;
  ctx.beginPath(); ctx.moveTo(0, H-11); ctx.lineTo(W, H-11); ctx.stroke();
  ctx.setLineDash([]); ctx.lineDashOffset = 0;
  for (let i = -1; i * PERIOD < W + PERIOD; i++) bus(ctx, i * PERIOD + off, spin);
}
function bus(ctx, x, spin){
  const H = ctx.canvas.height;
  ctx.save(); ctx.translate(x, 0);
  const bx=0, by=18, bw=210, bh=70, wy=by+bh+2;
  // sombra
  ctx.fillStyle = 'rgba(11,31,92,.18)';
  ctx.beginPath(); ctx.ellipse(bx+bw/2, wy+14, bw/2, 7, 0, 0, 7); ctx.fill();
  // carrocería
  ctx.fillStyle = '#F26A21';
  rr(ctx, bx, by, bw, bh, 16); ctx.fill();
  ctx.fillStyle = '#D9531A'; rr(ctx, bx, by+bh-14, bw, 14, 8); ctx.fill();
  // banda de ventanas
  ctx.fillStyle = '#0B1F5C'; rr(ctx, bx+10, by+8, bw-20, 30, 8); ctx.fill();
  ctx.fillStyle = '#9BDcF7';
  for (let i=0;i<5;i++){ rr(ctx, bx+18+i*37, by+13, 28, 20, 4); ctx.fill(); }
  // puerta
  ctx.fillStyle = '#0B1F5C'; rr(ctx, bx+bw-30, by+42, 22, 26, 4); ctx.fill();
  // faro
  ctx.fillStyle = '#FFE08A'; rr(ctx, bx+bw-8, by+44, 8, 12, 3); ctx.fill();
  // ruedas
  for (const cx of [bx+42, bx+bw-42]) {
    ctx.fillStyle = '#12141C'; ctx.beginPath(); ctx.arc(cx, wy, 16, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(cx, wy); ctx.rotate(spin);
    ctx.fillStyle = '#C7CDD9'; ctx.beginPath(); ctx.arc(0,0,7,0,7); ctx.fill();
    ctx.strokeStyle = '#C7CDD9'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let a=0;a<3;a++){ ctx.rotate(Math.PI/3);
      ctx.beginPath(); ctx.moveTo(-13,0); ctx.lineTo(13,0); ctx.stroke(); }
    ctx.restore();
  }
  ctx.restore();
}

async function makeBus(){
  log('generando GIF del bus…');
  const W=480, H=120;
  const workerBlob = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js').then(r=>r.blob());
  const gif = new GIF({ workers:2, quality:10, width:W, height:H, repeat:0, background:'#EEF3FA',
    workerScript: URL.createObjectURL(workerBlob) });
  const c = document.createElement('canvas'); c.width=W; c.height=H;
  const ctx = c.getContext('2d');
  const frames = 24;
  for (let f=0; f<frames; f++){
    const off = (f/frames) * PERIOD;       // recorre exactamente un período → loop perfecto
    scene(ctx, off, (f/frames)*Math.PI*4);
    gif.addFrame(ctx, { copy:true, delay: 75 });
  }
  gif.on('finished', blob => {
    const url = URL.createObjectURL(blob);
    const r = new FileReader();
    r.onload = () => {
      window.BUS_GIF = r.result;
      document.getElementById('busout').innerHTML =
        '<div>bus.gif ('+Math.round(blob.size/1024)+' KB)</div>'+
        '<img src="'+url+'"><textarea>'+r.result+'</textarea>';
      log('LISTO. Copia los textarea o dime que ya está.');
    };
    r.readAsDataURL(blob);
  });
  gif.render();
}
</script>
</body></html>
