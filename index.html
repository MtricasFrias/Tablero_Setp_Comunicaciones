<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Encuesta Cultura SETP</title>
<meta name="description" content="Encuesta de percepción de las charlas institucionales del SETP de Ibagué y panel de seguimiento.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --navy:#0B1F5C; --navy-deep:#071444; --cyan:#159BD6; --cyan-ink:#0E6FA0; --cyan-soft:#E6F4FB;
  --paper:#EEF2F9; --card:#FFFFFF; --ink:#0D1730; --muted:#5B6A88; --line:#E0E6F1; --line-2:#EDF1F8;
  --ok:#12925A; --warn:#B9821C; --bad:#CE3B26;
  --r1:#CE3B26; --r2:#DE7A38; --r3:#C09220; --r4:#5A9A5F; --r5:#12925A;
  --shadow:0 6px 20px rgba(11,31,92,.08); --shadow-lg:0 18px 44px rgba(11,31,92,.16);
  --radius:16px;
}
/* Tema institucional fijo (claro), sin importar el modo del celular. */
:root{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{scroll-behavior:smooth}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5; -webkit-text-size-adjust:100%; overflow-x:hidden;}
h1,h2,h3{font-family:"Barlow","Public Sans",system-ui,sans-serif; font-weight:800; line-height:1.1; letter-spacing:-.015em; text-wrap:balance; margin:0;}

@keyframes fadeUp{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)}}
@keyframes drive{0%{transform:translateX(-120%)} 60%{transform:translateX(6%)} 78%{transform:translateX(-3%)} 100%{transform:translateX(0)}}
@keyframes wheelspin{to{transform:rotate(360deg)}}
@keyframes heartpop{0%{transform:scale(0) rotate(-18deg)} 55%{transform:scale(1.25) rotate(6deg)} 100%{transform:scale(1) rotate(0)}}
@keyframes beat{0%,100%{transform:scale(1)} 14%{transform:scale(1.18)} 28%{transform:scale(1)} 42%{transform:scale(1.12)}}
@keyframes confetti{0%{opacity:1; transform:translateY(0) rotate(0)} 100%{opacity:0; transform:translateY(140px) rotate(320deg)}}
@keyframes shimmer{to{background-position:200% 0}}
.rise{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both}
.rise-2{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) .08s both}
.rise-3{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) .16s both}
a{color:var(--cyan-ink); text-decoration:none}
a:hover{text-decoration:underline}
.wrap{width:100%; max-width:1080px; margin:0 auto; padding:0 18px}
button{font:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--cyan); outline-offset:2px; border-radius:6px}

/* ---- top bar ---- */
.topbar{position:relative; overflow:hidden; color:#fff;
  background:linear-gradient(115deg,#071444 0%,#0B1F5C 46%,#123a7a 100%);
  border-bottom:4px solid var(--cyan)}
.topbar::after{content:""; position:absolute; top:0; right:-40px; width:230px; height:100%;
  background:linear-gradient(120deg,transparent 40%,rgba(21,155,214,.35) 40%,rgba(21,155,214,.35) 55%,transparent 55%,transparent 68%,rgba(255,255,255,.12) 68%,rgba(255,255,255,.12) 78%,transparent 78%);
  pointer-events:none}
.topbar .tbar{position:relative; z-index:1; display:flex; align-items:center; gap:14px; padding:16px 18px; max-width:1080px; margin:0 auto}
.lockup{display:flex; align-items:center; gap:9px; background:#fff; border-radius:12px; padding:7px 12px; flex-shrink:0;
  box-shadow:0 6px 18px rgba(0,0,0,.28)}
.lockup .lg{display:block; width:auto; object-fit:contain}
.lockup .lg-setp{height:40px}
.lockup .lg-alc{height:40px}
.brand{min-width:0}
.brand b{font-family:"Barlow",sans-serif; font-weight:800; font-size:23px; letter-spacing:.06em; display:block; color:#fff; line-height:1}
.brand span{font-size:12.5px; color:#B9D2F2; letter-spacing:.03em; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:3px}
@media(max-width:380px){ .brand b{font-size:19px} .brand span{font-size:10.5px} .lockup .lg{height:32px} .topbar .tbar{padding:13px 15px} }
.subbar,.subrow{max-width:1080px; margin:0 auto; padding:8px 18px; font-size:13px; color:#0D1730}
.topbar .subbar{background:var(--cyan-soft); color:var(--ink); border-bottom:1px solid var(--line)}
.subrow{display:flex; align-items:center; justify-content:space-between; background:var(--cyan-soft); border-bottom:1px solid var(--line)}
.subrow b{font-family:"Barlow",sans-serif; letter-spacing:.03em}
.lnk{background:none; border:1px solid var(--line); color:var(--cyan-ink); padding:5px 11px; border-radius:999px; font-size:12.5px; font-weight:600}
.lnk:hover{background:var(--cyan-soft)}

/* ---- portada ---- */
.hero{position:relative; overflow:hidden; color:#fff; text-align:center;
  padding:38px 20px 68px; isolation:isolate}
@media(min-width:640px){.hero{padding:60px 20px 80px}}
.hero::before{content:""; position:absolute; inset:0; z-index:-2;
  background:url("img/ocobos.jpg") center 38%/cover no-repeat; transform:scale(1.05)}
.hero::after{content:""; position:absolute; inset:0; z-index:-1;
  background:linear-gradient(180deg,rgba(7,20,68,.72) 0%,rgba(9,26,80,.8) 55%,rgba(9,26,80,.96) 100%)}
.hero .eyebrow{color:#8FD3F2}
.eyebrow{font-family:"Barlow",sans-serif; text-transform:uppercase; letter-spacing:.18em; font-size:12px; font-weight:700; color:var(--cyan-ink); margin:0 0 14px}
.hero h1{font-size:clamp(29px,7vw,46px); color:#fff; max-width:16ch; margin:0 auto; text-shadow:0 2px 24px rgba(0,0,0,.35)}
.hero .lead{color:#D8E4F5; font-size:16.5px; margin:16px auto 0; max-width:42ch; line-height:1.55}
.hero .scroll-cue{display:inline-block; margin-top:26px; font-size:24px; animation:floaty 2.4s ease-in-out infinite}

.portada{max-width:640px; margin:0 auto; padding:30px 18px 60px}
.doors{display:grid; gap:15px; text-align:left; margin-top:-46px; position:relative; z-index:2}
.door{display:grid; grid-template-columns:auto 1fr auto; align-items:center; column-gap:15px;
  background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:var(--shadow-lg);
  transition:transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .16s}
.door:hover,.door:focus-visible{transform:translateY(-3px) scale(1.012); box-shadow:0 24px 50px rgba(11,31,92,.22); text-decoration:none}
.door:active{transform:translateY(-1px) scale(.996)}
.door .di{font-size:26px; width:52px; height:52px; display:grid; place-items:center; background:var(--cyan-soft); border-radius:14px; transition:transform .16s}
.door:hover .di{transform:rotate(-6deg) scale(1.06)}
.door .dtx{min-width:0}
.door .dt{display:block; font-family:"Barlow",sans-serif; font-weight:800; font-size:18px; color:var(--navy); line-height:1.15}
.door .dd{display:block; font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.3}
.door .darr{font-size:20px; color:var(--cyan); transition:transform .16s}
.door:hover .darr{transform:translateX(4px)}
.door-go{border-color:var(--cyan); box-shadow:0 14px 34px rgba(21,155,214,.28)}
.door-go .di{background:linear-gradient(135deg,var(--cyan),#0E6FA0); color:#fff}
.portada .lead{color:var(--muted); font-size:15px; margin:24px auto 0; max-width:46ch; text-align:center}
.foot{margin-top:24px; font-size:12px; color:var(--muted); text-align:center}
.dbline{margin-top:6px; font-weight:700; color:var(--cyan-ink); text-align:center}
.stripwrap{margin-top:34px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.strip{width:96px; height:64px; border-radius:12px; object-fit:cover; box-shadow:var(--shadow); filter:saturate(1.05)}

/* ---- forms shared ---- */
.fl{display:block; font-size:13.5px; font-weight:600; color:var(--ink); margin-top:16px}
.fl em{color:var(--muted); font-weight:400}
.fl .hint{display:block; font-weight:400; color:var(--muted); font-size:12px; margin-top:2px}
input,textarea{width:100%; margin-top:6px; padding:12px 13px; font-family:inherit; font-size:16px; color:var(--ink);
  background:var(--card); border:1.5px solid var(--line); border-radius:11px}
input:focus,textarea:focus{border-color:var(--cyan); outline:none; box-shadow:0 0 0 3px rgba(21,155,214,.18)}
textarea{resize:vertical; min-height:70px}
.cta{width:100%; margin-top:22px; padding:15px 18px; border:0; border-radius:14px; color:#fff;
  background:linear-gradient(135deg,#1AA9E0,#0E6FA0);
  font-family:"Barlow",sans-serif; font-weight:800; font-size:16.5px; letter-spacing:.03em;
  box-shadow:0 12px 26px rgba(21,155,214,.35); transition:transform .14s, box-shadow .14s, filter .14s}
.cta:hover{filter:brightness(1.06); box-shadow:0 16px 32px rgba(21,155,214,.45); transform:translateY(-1px)}
.cta:active{transform:translateY(1px) scale(.99)}
.cta[disabled]{opacity:.65; cursor:progress; filter:saturate(.7)}
.cta.sm{width:auto; font-size:14px; padding:10px 16px; box-shadow:none}
.err{margin:12px 0 0; color:var(--bad); font-size:13.5px; font-weight:600; background:rgba(206,59,38,.08); padding:9px 12px; border-radius:9px}
.micro{font-size:12px; color:var(--muted); margin-top:12px}

/* ---- survey ---- */
.survey{padding:28px 18px 64px; max-width:560px; animation:fadeUp .45s ease both}
#surveyCard{position:relative; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px 22px; box-shadow:var(--shadow-lg); overflow:hidden}
#surveyCard::before{content:""; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--r1),var(--r2),var(--r3),var(--r4),var(--r5))}
.survey h2{font-size:24px; color:var(--navy); margin-top:4px}
.survey .sub{color:var(--muted); font-size:14px; margin:6px 0 0}
.rate{display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin-top:18px}
.rb{display:flex; flex-direction:column; align-items:center; gap:6px; padding:13px 3px; border:2px solid var(--line);
  background:var(--card); border-radius:14px; color:var(--muted); min-height:82px; justify-content:center;
  transition:transform .16s cubic-bezier(.2,1.5,.5,1), border-color .16s, background .16s}
.rb span{font-size:27px; line-height:1; filter:grayscale(.45) opacity(.8); transition:.16s}
.rb small{font-size:10px; font-weight:700; text-align:center; letter-spacing:0; line-height:1.15}
.rb:hover{border-color:var(--cyan); transform:translateY(-2px)}
.rb:hover span{filter:none}
.rb.on{border-color:var(--cyan); background:var(--cyan-soft); color:var(--navy); transform:translateY(-4px) scale(1.05); box-shadow:0 10px 22px rgba(21,155,214,.25)}
.rb.on span{filter:none; transform:scale(1.18)}

/* ---- selector de equipo ---- */
.teampick{display:grid; gap:12px; margin-top:20px}
.tp{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:16px 18px;
  border:2px solid var(--line); border-left:6px solid var(--tc); border-radius:15px; background:#fff; color:var(--navy);
  transition:transform .15s cubic-bezier(.2,.7,.3,1), box-shadow .15s, background .15s}
.tp:hover,.tp:focus-visible{transform:translateY(-3px); box-shadow:0 16px 34px rgba(11,31,92,.16); background:color-mix(in srgb,var(--tc) 8%,#fff)}
.tp:active{transform:translateY(-1px) scale(.99)}
.tp .tpn{flex-shrink:0; width:38px; height:38px; display:grid; place-items:center; border-radius:11px;
  background:var(--tc); color:#fff; font-family:"Barlow",sans-serif; font-weight:800; font-size:19px}
.tp .tpx{flex:1; font-family:"Barlow",sans-serif; font-weight:800; font-size:16px; line-height:1.2}
.tp .tparr{color:var(--tc); font-size:20px; transition:transform .15s}
.tp:hover .tparr{transform:translateX(4px)}

/* ---- thanks ---- */
.thanks{max-width:520px; margin:0 auto; padding:48px 22px 64px; text-align:center; animation:fadeUp .4s ease both}
.scene{position:relative; width:230px; height:150px; margin:0 auto 14px}
.bus{position:absolute; left:0; bottom:14px; width:190px; animation:drive 1.1s cubic-bezier(.2,.8,.3,1) both}
.bus .wheel{transform-box:fill-box; transform-origin:center; animation:wheelspin .5s linear .9s 3}
.road{position:absolute; left:0; right:0; bottom:12px; height:3px; background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 26px)}
.heart{position:absolute; right:6px; top:0; font-size:40px; animation:heartpop .5s .7s both, beat 1.1s 1.2s ease 2}
.thanks .conf{position:absolute; top:8px; width:9px; height:14px; border-radius:2px; opacity:0}
.thanks.go .conf{animation:confetti .9s ease-out .6s forwards}
.thanks .check{width:78px; height:78px; margin:0 auto 18px; border-radius:50%; background:linear-gradient(135deg,var(--ok),#0c7a4a); color:#fff;
  font-size:40px; display:grid; place-items:center; font-weight:800; box-shadow:0 12px 28px rgba(18,146,90,.35)}
.thanks .check.anim{animation:heartpop .5s cubic-bezier(.2,1.4,.5,1)}
.thanks h2{font-size:26px; color:var(--navy)}
.thanks p{color:var(--muted); font-size:16.5px; margin:12px auto 0; max-width:38ch; line-height:1.55}
.thanks .cta{max-width:280px; margin-inline:auto}
@media (prefers-reduced-motion:reduce){ .bus{animation:none} .heart{animation:none} .thanks.go .conf{animation:none; opacity:0} }

/* ---- login ---- */
.login{max-width:420px; padding:44px 18px 60px}
.login h2{font-size:24px; color:var(--navy)}
.login .sub{color:var(--muted); font-size:14px; margin:6px 0 8px}

/* ---- dashboard ---- */
.dash{padding:20px 18px 70px; display:grid; gap:16px}
.dash>*{min-width:0}
.panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); min-width:0}
.panel h3{font-size:16px; color:var(--navy); margin-bottom:12px}
.panel h3 .hint{font-family:"Public Sans",sans-serif; font-weight:400; font-size:12.5px; color:var(--muted); letter-spacing:0}
.kpis{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpis>*{min-width:0}
.teams>*{min-width:0}
.charts>*{min-width:0}
.dash section{animation:fadeUp .4s ease both}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:15px; padding:15px 16px; box-shadow:var(--shadow); border-top:3px solid var(--cyan); transition:transform .14s, box-shadow .14s}
.kpi:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg)}
.kpi .l{font-family:"Barlow",sans-serif; text-transform:uppercase; letter-spacing:.1em; font-size:10.5px; font-weight:700; color:var(--muted)}
.kpi .v{font-family:"Barlow",sans-serif; font-weight:800; font-size:32px; color:var(--navy); line-height:1.05; margin-top:4px; font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px; color:var(--muted); margin-top:2px}

.goals{}
.goalrow{display:grid; gap:6px; padding:12px 0; border-top:1px solid var(--line-2)}
.goalrow:first-child{border-top:0; padding-top:0}
.goalrow .gt{display:flex; justify-content:space-between; font-size:13.5px; font-weight:600}
.goalrow .gt b{font-family:"Barlow",sans-serif; font-variant-numeric:tabular-nums}
.bar{height:10px; background:var(--line); border-radius:999px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--cyan); border-radius:999px; transition:width .5s ease}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.goalgrid{display:grid; gap:14px; grid-template-columns:1fr; align-items:center}
@media(min-width:620px){.goalgrid{grid-template-columns:170px 1fr}}
.ring{--p:0; width:150px; height:150px; margin:4px auto; border-radius:50%; position:relative;
  background:conic-gradient(var(--cyan) calc(var(--p)*1%), var(--line) 0); display:grid; place-items:center}
.ring::before{content:""; position:absolute; inset:19px; border-radius:50%; background:var(--card)}
.ring .rc{position:relative; text-align:center; z-index:1}
.ring .rc b{font-family:"Barlow",sans-serif; font-size:30px; font-weight:800; color:var(--navy); display:block; line-height:1}
.ring .rc span{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}

.teams{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.tcard{position:relative; overflow:hidden; border:1px solid var(--line); border-top:4px solid var(--tc,var(--cyan)); border-radius:16px; padding:16px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--tc,var(--cyan)) 7%,#fff),#fff);
  transition:transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .16s}
.tcard:hover{transform:translateY(-3px); box-shadow:0 18px 38px rgba(11,31,92,.16)}
.thead-t{display:flex; align-items:center; justify-content:space-between; gap:8px}
.tname{font-family:"Barlow",sans-serif; font-weight:800; font-size:14.5px; color:var(--navy); line-height:1.15}
.rankb{flex-shrink:0; font-size:11px; font-weight:800; font-family:"Barlow",sans-serif; padding:3px 8px; border-radius:999px; background:var(--tc,var(--cyan)); color:#fff; letter-spacing:.02em}
.tbig{font-family:"Barlow",sans-serif; font-weight:800; font-size:34px; color:var(--tc,var(--cyan)); margin:8px 0 4px; font-variant-numeric:tabular-nums; line-height:1}
.tbig small{font-size:13px; color:var(--muted); font-weight:700}
.tpct{font-size:12px; font-weight:700; color:var(--muted); margin-bottom:8px}
.tstats{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px}
.tstat{background:#fff; border:1px solid var(--line); border-radius:10px; padding:7px 4px; text-align:center}
.tstat span{display:block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
.tstat b{font-family:"Barlow",sans-serif; font-size:16px; color:var(--navy); font-variant-numeric:tabular-nums}
.tlink{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap}
.tlink input{margin:0; padding:7px 9px; font-size:12px; border-radius:8px; flex:1 1 100%; min-width:0}
.tlink .lnk{flex-shrink:0; padding:5px 11px}
.qrbox{margin-top:10px; display:flex; flex-direction:column; align-items:center; gap:6px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px}
.qrbox canvas{display:block; width:150px !important; height:150px !important}
.qrbox img{display:none}
.qrbox .qcap{font-size:11px; color:var(--muted); word-break:break-all; text-align:center; line-height:1.3}

.charts{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.cbox{position:relative; height:240px}
.cbox canvas{position:absolute; inset:0}

.thead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.thead h3{margin:0; flex:1}
.filters{display:flex; gap:5px}
.filters button{border:1px solid var(--line); background:var(--card); color:var(--muted); padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600}
.filters button.on{background:var(--navy); color:#fff; border-color:var(--navy)}
.tablewrap{overflow-x:auto; border:1px solid var(--line-2); border-radius:12px}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:560px}
th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--line-2); vertical-align:top}
th{font-family:"Barlow",sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px; color:var(--muted); background:var(--line-2)}
td:nth-child(2){font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
.chip{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; color:#fff; white-space:nowrap}
.chip.r1{background:var(--r1)} .chip.r2{background:var(--r2)} .chip.r3{background:var(--r3)} .chip.r4{background:var(--r4)} .chip.r5{background:var(--r5)}
.demoNote{margin:10px 0 0; font-size:12.5px; color:var(--warn); font-weight:600}
.empty{padding:26px 12px; text-align:center; color:var(--muted); font-size:13.5px}

.cfgbox summary{font-family:"Barlow",sans-serif; font-weight:700; font-size:15px; color:var(--navy); cursor:pointer}
.cfg{margin-top:12px; display:grid; gap:2px}
.cfg .fl input,.cfg .fl textarea{max-width:420px}
.cfgactions{display:flex; gap:12px; align-items:center; margin-top:16px; flex-wrap:wrap}
#cfgmsg,#cfgmsg:empty{min-height:1em}

@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ═══════════ CONFIGURACIÓN — edita estas 2 líneas ═══════════
     API_URL  : URL del despliegue de Apps Script (termina en /exec). Ver INSTALACION.md.
     ADMIN_PASS: contraseña del panel de análisis. Cámbiala antes de publicar.        */
  var API_URL   = "https://script.google.com/macros/s/AKfycbwDK6C_tFaIH5yZRRUeeI6JH_DZZNr2XsxNkOgxcw9WZQU3FtxQBJVaBcxm_AsImx1XCA/exec";
  var ADMIN_PASS = "culturasetp2026";
  /* ══════════════════════════════════════════════════════════ */
  var API_OK = /^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL);

  var $=function(s,r){return (r||document).querySelector(s);};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
  var app=document.getElementById("app");

  var FALLBACK={
    metaTotal:1000, metaDiaria:40,
    equipos:{"1":"Equipo 1 · Territorio","2":"Equipo 2 · Paraderos","3":"Equipo 3 · Instituciones"},
    padron:[]
  };
  var LS_KEY="csetp_demo_responses";   /* respaldo local cuando no hay API (modo demostración) */
  var RLAB={1:"Muy mala",2:"Mala",3:"Regular",4:"Buena",5:"Excelente"};
  var RAMP=["","#CE3B26","#DE7A38","#C09220","#5A9A5F","#12925A"];

  var LOGOS={setp:"",alc:""};
  var apiState= API_OK ? "loading" : "demo";   /* loading | ready | error | demo */
  var cfg=clone(FALLBACK);
  var responses=[];
  var view={key:null};
  var charts={};
  var authed=false;
  try{ authed=sessionStorage.getItem("csetp_admin")==="1"; }catch(e){}
  var panelFilter="all";
  var pollTimer=null;

  function clone(o){return JSON.parse(JSON.stringify(o));}
  function bogota(d){return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Bogota"}).format(d||new Date());}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  function eqName(k){k=String(k); if(cfg.equipos&&cfg.equipos[k])return cfg.equipos[k]; return (k&&k!=="0")?("Equipo "+k):"Sin equipo";}
  function baseURL(){return location.origin+location.pathname;}

  function normCfg(d){
    d=d||{};
    var eq=Object.assign({},FALLBACK.equipos,d.equipos||{});
    if(d.equipo1) eq["1"]=String(d.equipo1);
    if(d.equipo2) eq["2"]=String(d.equipo2);
    if(d.equipo3) eq["3"]=String(d.equipo3);
    return {
      metaTotal:(+d.metaTotal>0)?+d.metaTotal:FALLBACK.metaTotal,
      metaDiaria:(+d.metaDiaria>0)?+d.metaDiaria:FALLBACK.metaDiaria,
      equipos:eq,
      padron:Array.isArray(d.padron)?d.padron.map(String):[],
      padronOn: !!d.padron  /* si el backend informa que hay padrón cargado */
    };
  }

  window.start=function(logos){
    LOGOS=logos||LOGOS;
    render();
    if(!API_OK){ apiState="demo"; loadLocal(); render(); return; }
    loadData();
    pollTimer=setInterval(function(){ if(document.visibilityState!=="hidden") loadData(true); }, 60000);
  };
  addEventListener("hashchange", render);
  var mq=window.matchMedia&&matchMedia("(prefers-color-scheme:dark)");
  if(mq&&mq.addEventListener) mq.addEventListener("change", function(){
    if(view.name==="panel"&&authed){ destroyCharts(); buildCharts(); refreshPanel(); }
  });

  /* ---------- datos (Google Apps Script) ---------- */
  function mapRow(r){
    return { cedula:String(r.documento||r.cedula||""), rating:+r.valoracion||+r.rating||0,
             comentario:String(r.comentario||""), equipo:String(r.equipo||"0"),
             ts:+r.ts||0, fecha:String(r.fecha||""), demo:false };
  }
  function loadData(silent){
    if(!silent && view.name==="panel" && authed && $("#refreshBtn")) $("#refreshBtn").textContent="Actualizando…";
    fetch(API_URL+"?action=data&t="+Date.now(),{method:"GET"})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d || d.ok===false) throw new Error(d && d.error || "respuesta inválida");
        cfg=normCfg(d.config||{});
        responses=(d.rows||[]).map(mapRow);
        apiState="ready";
        refresh();
      })
      .catch(function(e){
        console.warn("loadData:", e && e.message);
        if(apiState!=="ready") apiState="error";
        refresh();
      });
  }
  function loadLocal(){
    try{ responses=(JSON.parse(localStorage.getItem(LS_KEY))||[]).map(mapRow); }catch(e){ responses=[]; }
  }
  function saveLocal(row){
    try{ var a=JSON.parse(localStorage.getItem(LS_KEY))||[]; a.push(row); localStorage.setItem(LS_KEY,JSON.stringify(a)); }catch(e){}
  }

  /* ---------- routing ---------- */
  function parseRoute(){
    var h=(location.hash.slice(1)||"/").replace(/\/+$/,"")||"/";
    var m=h.match(/^\/e(?:\/([123]))?$/);
    if(m) return {name:"encuesta", team:m[1]||null};
    if(h==="/panel") return {name:"panel"};
    return {name:"portada"};
  }
  function render(){
    var r=parseRoute();
    var key = r.name==="encuesta" ? "e"+(r.team||"")
            : r.name==="panel" ? "panel"+(authed?"":":login")
            : "portada";
    if(key!==view.key){
      destroyCharts();
      view=Object.assign({key:key}, r);
      if(r.name==="encuesta") mountEncuesta();
      else if(r.name==="panel") mountPanel();
      else mountPortada();
      window.scrollTo(0,0);
    }
    refresh();
  }
  function refresh(){
    if(view.name==="encuesta") refreshEncuesta();
    else if(view.name==="panel"&&authed) refreshPanel();
    else if(view.name==="portada") refreshPortada();
  }

  /* ---------- shared header ---------- */
  function header(sub){
    return '<header class="topbar"><div class="tbar">'+
      '<div class="lockup">'+
        '<img class="lg lg-setp" alt="TRIANS MUSICAL · SETP" src="'+LOGOS.setp+'">'+
        '<img class="lg lg-alc" alt="Alcaldía de Ibagué" src="'+LOGOS.alc+'">'+
      '</div>'+
      '<div class="brand"><b>CULTURA SETP</b><span>Tu comportamiento mueve la ciudad</span></div>'+
      '</div>'+ (sub?('<div class="subbar" id="subbar">'+sub+'</div>'):'') +'</header>';
  }

  /* ---------- portada ---------- */
  function mountPortada(){
    app.innerHTML=header()+
    '<section class="hero">'+
      '<p class="eyebrow rise">Sistema Estratégico de Transporte Público de Ibagué</p>'+
      '<h1 class="rise-2">Encuesta de percepción de las charlas institucionales</h1>'+
      '<p class="lead rise-3">Cuéntanos qué te pareció la charla. Toma menos de un minuto y tu voz mejora la movilidad de Ibagué.</p>'+
      '<span class="scroll-cue" aria-hidden="true">↓</span>'+
    '</section>'+
    '<main class="wrap portada">'+
      '<div class="doors">'+
        '<a class="door door-go rise" href="#/e"><span class="di">✍️</span>'+
          '<span class="dtx"><span class="dt">Responder la encuesta</span><span class="dd">Para asistentes a la charla · 3 preguntas</span></span>'+
          '<span class="darr" aria-hidden="true">→</span></a>'+
        '<a class="door rise-2" href="#/panel"><span class="di">📊</span>'+
          '<span class="dtx"><span class="dt">Panel de seguimiento</span><span class="dd">Estadísticas y metas · requiere clave</span></span>'+
          '<span class="darr" aria-hidden="true">→</span></a>'+
      '</div>'+
      '<p class="foot">Área de Comunicaciones · Estrategia CULTURA SETP — “Tu comportamiento mueve la ciudad”.</p>'+
      '<p class="foot dbline" id="dbline"></p>'+
    '</main>';
  }
  function refreshPortada(){
    var el=$("#dbline"); if(!el) return;
    el.textContent = apiState==="ready" ? (responses.length+" respuestas registradas hasta ahora.")
      : apiState==="demo" ? "Modo demostración — configura el sistema para guardar respuestas de verdad."
      : apiState==="error" ? "Sin conexión con el servidor de datos en este momento."
      : "";
  }

  /* ---------- encuesta ---------- */
  var rating=0;
  var TCOL={"1":"#159BD6","2":"#12925A","3":"#C77D1F"};
  function mountEncuesta(){
    rating=0;
    var t=view.team;
    if(!t){
      app.innerHTML=header('Selecciona tu equipo')+
      '<main class="wrap survey"><div id="surveyCard">'+
        '<h2>¿Con qué equipo estás respondiendo?</h2>'+
        '<p class="sub">Elige el equipo de la persona que te hizo la encuesta. Es obligatorio para registrar tu respuesta.</p>'+
        '<div class="teampick">'+
          ["1","2","3"].map(function(k){
            return '<button type="button" class="tp" data-k="'+k+'" style="--tc:'+TCOL[k]+'">'+
              '<span class="tpn">'+k+'</span><span class="tpx">'+esc(eqName(k))+'</span>'+
              '<span class="tparr" aria-hidden="true">→</span></button>';
          }).join("")+
        '</div>'+
        '<p class="micro">¿Recibiste un enlace directo de tu encuestador? Ábrelo y esta pantalla no aparecerá.</p>'+
      '</div></main>';
      $$(".teampick .tp").forEach(function(b){
        b.onclick=function(){ location.hash="#/e/"+b.dataset.k; };
      });
      return;
    }
    app.innerHTML=header(t?('Encuesta del equipo: <b id="teamlbl">'+esc(eqName(t))+'</b>'):'Encuesta general')+
    '<main class="wrap survey"><div id="surveyCard">'+
      '<h2>¿Qué te pareció la charla?</h2>'+
      '<p class="sub">Marca una opción. Tus respuestas son confidenciales.</p>'+
      '<div class="rate" id="rate">'+
        [[1,"😠"],[2,"🙁"],[3,"😐"],[4,"🙂"],[5,"😄"]].map(function(p){
          return '<button type="button" class="rb" data-v="'+p[0]+'"><span>'+p[1]+'</span><small>'+RLAB[p[0]]+'</small></button>';
        }).join("")+
      '</div>'+
      '<label class="fl" for="ced">Documento de identidad'+
        '<input id="ced" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="Número de cédula">'+
        '<span class="hint">Lo usamos solo para no repetir registros.</span></label>'+
      '<label class="fl" for="com">¿Algo que quieras contarnos? <em>(opcional)</em>'+
        '<textarea id="com" maxlength="500" rows="3" placeholder="Lo que te gustó, lo que mejorarías…"></textarea></label>'+
      '<p class="err" id="err" hidden></p>'+
      '<button class="cta" id="send">Enviar respuesta</button>'+
      '<p class="micro" id="dbmicro"></p>'+
    '</div></main>';
    $$("#rate .rb").forEach(function(b){
      b.onclick=function(){
        rating=+b.dataset.v;
        $$("#rate .rb").forEach(function(x){x.classList.toggle("on",x===b);});
        $("#err").hidden=true;
      };
    });
    $("#ced").addEventListener("input",function(){ this.value=this.value.replace(/\D/g,"").slice(0,10); });
    $("#send").onclick=doSubmit;
  }
  function refreshEncuesta(){
    var lbl=$("#teamlbl"); if(lbl&&view.team) lbl.textContent=eqName(view.team);
    var m=$("#dbmicro"); if(m) m.textContent = apiState==="demo" ? "Modo demostración: la respuesta se guarda solo en este dispositivo." : "";
  }
  function doSubmit(){
    var ced=($("#ced").value||"").replace(/\D/g,"");
    var com=($("#com").value||"").trim().slice(0,500);
    var err=$("#err");
    function bad(t){ err.textContent=t; err.hidden=false; err.scrollIntoView({block:"center",behavior:"smooth"}); }
    if(!rating) return bad("Selecciona qué te pareció la charla.");
    if(!/^\d{6,10}$/.test(ced)) return bad("Escribe un documento válido (6 a 10 dígitos).");
    var btn=$("#send"); btn.disabled=true; btn.textContent="Enviando…";
    var row={cedula:ced, rating:rating, comentario:com, equipo:view.team||"0", ts:Date.now(), fecha:bogota(), demo:false};

    if(apiState==="demo"){
      if(responses.some(function(r){return r.cedula===ced;})){ return thanks({already:true}); }
      saveLocal({documento:ced, valoracion:rating, comentario:com, equipo:row.equipo, ts:row.ts, fecha:row.fecha});
      responses.push(row);
      return thanks({demo:true});
    }

    var body=new URLSearchParams({documento:ced, valoracion:String(rating), comentario:com, equipo:row.equipo});
    fetch(API_URL,{method:"POST",body:body})
      .then(function(r){ return r.json().catch(function(){ return {ok:true}; }); })
      .then(function(d){
        if(d && d.ok===false){
          if(d.error==="padron") return thanks({padron:true});
          throw new Error(d.error||"error");
        }
        responses.push(row);
        thanks(d && d.dup ? {already:true} : {});
      })
      .catch(function(e){
        btn.disabled=false; btn.textContent="Enviar respuesta";
        bad("No se pudo enviar la respuesta. Revisa la conexión a internet e intenta otra vez.");
      });
  }
  function thanks(o){
    o=o||{};
    var rm = window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches;
    var main=app.querySelector("main");
    main.className="wrap";
    if(o.padron){
      main.innerHTML=
      '<div class="thanks">'+
        '<div class="check" style="background:var(--warn)">!</div>'+
        '<h2>Documento no habilitado</h2>'+
        '<p>Este número no está en el listado de participantes de la charla. Verifícalo con el encuestador.</p>'+
        '<button class="cta" id="again">Volver a intentar</button>'+
      '</div>';
    } else {
      var scene = rm ? '<div class="check anim">✓</div>' :
        '<div class="scene">'+
          '<span class="conf" style="left:22%;background:var(--r1)"></span>'+
          '<span class="conf" style="left:40%;background:var(--cyan)"></span>'+
          '<span class="conf" style="left:58%;background:var(--r4)"></span>'+
          '<span class="conf" style="left:76%;background:var(--gold,#E8A400)"></span>'+
          '<div class="road"></div>'+
          '<svg class="bus" viewBox="0 0 190 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
            '<rect x="4" y="12" width="164" height="60" rx="12" fill="#F26A21"/>'+
            '<rect x="12" y="20" width="150" height="26" rx="6" fill="#0B1F5C"/>'+
            '<rect x="18" y="24" width="26" height="18" rx="3" fill="#8FD3F2"/>'+
            '<rect x="52" y="24" width="26" height="18" rx="3" fill="#8FD3F2"/>'+
            '<rect x="86" y="24" width="26" height="18" rx="3" fill="#8FD3F2"/>'+
            '<rect x="120" y="24" width="34" height="18" rx="3" fill="#8FD3F2"/>'+
            '<rect x="150" y="50" width="18" height="14" rx="3" fill="#FFD23F"/>'+
            '<circle class="wheel" cx="46" cy="76" r="15" fill="#12203a"/><circle cx="46" cy="76" r="5" fill="#8a94a6"/>'+
            '<circle class="wheel" cx="132" cy="76" r="15" fill="#12203a"/><circle cx="132" cy="76" r="5" fill="#8a94a6"/>'+
          '</svg>'+
          '<span class="heart">💙</span>'+
        '</div>';
      main.innerHTML=
      '<div class="thanks'+(rm?"":" go")+'">'+
        scene+
        '<h2>'+(o.already?"Ya teníamos tu respuesta":"¡Gracias por responder!")+'</h2>'+
        '<p>Tu respuesta ya está moviendo a Ibagué: nos ayuda a mejorar la calidad y la movilidad del transporte público.</p>'+
        (o.demo?'<p class="micro">Modo demostración: se guardó solo en este dispositivo.</p>':'')+
        '<button class="cta" id="again">Responder otra</button>'+
      '</div>';
    }
    $("#again").onclick=function(){ view.key=null; render(); };
    window.scrollTo(0,0);
  }

  /* ---------- panel ---------- */
  function mountPanel(){
    if(!authed){
      app.innerHTML=header()+
      '<main class="wrap login">'+
        '<h2>Panel administrativo</h2>'+
        '<p class="sub">Acceso para el equipo de Comunicaciones del SETP.</p>'+
        '<label class="fl" for="pass">Contraseña<input id="pass" type="password" autocomplete="off"></label>'+
        '<p class="err" id="lerr" hidden>Contraseña incorrecta.</p>'+
        '<button class="cta" id="enter">Entrar</button>'+
        '<p class="micro"><a href="#/">← Volver al inicio</a></p>'+
      '</main>';
      var go=function(){
        if($("#pass").value===ADMIN_PASS){
          authed=true; try{sessionStorage.setItem("csetp_admin","1");}catch(e){}
          view.key=null; render();
        } else $("#lerr").hidden=false;
      };
      $("#enter").onclick=go;
      $("#pass").addEventListener("keydown",function(e){ if(e.key==="Enter") go(); });
      return;
    }
    panelFilter="all";
    app.innerHTML=header()+
    '<div class="subrow"><b>Seguimiento · CULTURA SETP</b><span><button class="lnk" id="refreshBtn">Actualizar</button> <button class="lnk" id="logout">Salir</button></span></div>'+
    '<main class="wrap dash">'+
      '<section class="kpis" id="kpis"></section>'+
      '<section class="panel goals"><h3>Cumplimiento de metas</h3><div id="goals"></div></section>'+
      '<section class="panel"><h3>Equipos de encuestadores <span class="hint">— comparte un enlace distinto con cada persona</span></h3><div class="teams" id="teams"></div></section>'+
      '<section class="charts">'+
        '<div class="panel"><h3>Respuestas por día (últimos 14)</h3><div class="cbox"><canvas id="cDia"></canvas></div></div>'+
        '<div class="panel"><h3>Valoración de las charlas</h3><div class="cbox"><canvas id="cRate"></canvas></div></div>'+
        '<div class="panel"><h3>Aporte por equipo</h3><div class="cbox"><canvas id="cTeam"></canvas></div></div>'+
      '</section>'+
      '<section class="panel">'+
        '<div class="thead"><h3>Últimas respuestas</h3><div class="filters" id="filters"></div><button class="lnk" id="csv">Exportar CSV</button></div>'+
        '<div class="tablewrap"><table id="tbl"><thead><tr><th>Fecha</th><th>Documento</th><th>Equipo</th><th>Valoración</th><th>Comentario</th></tr></thead><tbody></tbody></table></div>'+
      '</section>'+
      '<p class="micro" id="cfgmsg" style="text-align:center"></p>'+
    '</main>';
    $("#logout").onclick=function(){ authed=false; try{sessionStorage.removeItem("csetp_admin");}catch(e){} view.key=null; render(); };
    $("#refreshBtn").onclick=function(){ apiState==="demo"?(loadLocal(),refresh()):loadData(); };
    $("#csv").onclick=exportCSV;
    ["all","1","2","3"].forEach(function(k){
      var b=document.createElement("button"); b.textContent=k==="all"?"Todos":("Eq. "+k); b.dataset.k=k;
      b.onclick=function(){ panelFilter=k; $$("#filters button").forEach(function(x){x.classList.toggle("on",x===b);}); fillTable(); };
      if(k==="all") b.classList.add("on");
      $("#filters").appendChild(b);
    });
    buildCharts();
  }

  function computeStats(){
    var today=bogota();
    var R=responses;
    function agg(a){
      return {n:a.length,
        hoy:a.filter(function(r){return r.fecha===today;}).length,
        avg:a.length?a.reduce(function(s,r){return s+(+r.rating||0);},0)/a.length:0,
        sat:a.length?a.filter(function(r){return +r.rating>=4;}).length/a.length:0};
    }
    function byTeam(k){ return R.filter(function(r){return String(r.equipo)===k;}); }
    var days=[];
    for(var i=13;i>=0;i--){
      var d=bogota(new Date(Date.now()-i*86400000));
      days.push({d:d.slice(5), n:R.filter(function(r){return r.fecha===d;}).length});
    }
    return {
      all:agg(R),
      teams:{"1":agg(byTeam("1")),"2":agg(byTeam("2")),"3":agg(byTeam("3")),"0":agg(byTeam("0"))},
      dist:[1,2,3,4,5].map(function(v){return R.filter(function(r){return +r.rating===v;}).length;}),
      days:days, today:today, demo:R.filter(function(r){return r.demo;}).length
    };
  }

  function refreshPanel(){
    if(!$("#kpis")) return;
    var s=computeStats();
    var pf=function(x){return (x*100).toFixed(0)+"%";};
    var estado = apiState==="ready"?"" : apiState==="error"?"sin conexión al servidor" : apiState==="demo"?"modo demostración (local)" : "cargando…";
    $("#kpis").innerHTML=[
      ["Respuestas totales", s.all.n, estado],
      ["Respuestas hoy", s.all.hoy, "meta "+cfg.metaDiaria],
      ["Valoración promedio", s.all.n?s.all.avg.toFixed(1):"—", "de 1 a 5"],
      ["Satisfacción", s.all.n?pf(s.all.sat):"—", "valoración 4 o 5"]
    ].map(function(k){
      return '<div class="kpi"><div class="l">'+k[0]+'</div><div class="v">'+k[1]+'</div><div class="s">'+k[2]+'</div></div>';
    }).join("");

    var pTot=cfg.metaTotal?Math.min(100,s.all.n/cfg.metaTotal*100):0;
    var pDay=cfg.metaDiaria?Math.min(100,s.all.hoy/cfg.metaDiaria*100):0;
    var cls=function(p){return p>=100?"ok":p>=60?"warn":"bad";};
    var ndays=s.days.filter(function(d){return d.n>0;}).length||1;
    var promDia=(s.all.n/ndays);
    $("#goals").innerHTML=
      '<div class="goalgrid">'+
        '<div class="ring" style="--p:'+pDay.toFixed(1)+'"><div class="rc"><b>'+s.all.hoy+'</b><span>hoy / '+cfg.metaDiaria+'</span></div></div>'+
        '<div>'+
          '<div class="goalrow"><div class="gt"><span>Meta total</span><b>'+s.all.n+' / '+cfg.metaTotal+'</b></div>'+
            '<div class="bar"><i class="'+cls(pTot)+'" style="width:'+pTot.toFixed(1)+'%"></i></div></div>'+
          '<div class="goalrow"><div class="gt"><span>Meta de hoy</span><b>'+pDay.toFixed(0)+'%</b></div>'+
            '<div class="bar"><i class="'+cls(pDay)+'" style="width:'+pDay.toFixed(1)+'%"></i></div></div>'+
          '<div class="goalrow"><div class="gt"><span>Promedio diario</span><b>'+promDia.toFixed(1)+'</b></div>'+
            '<div class="bar"><i class="'+cls(cfg.metaDiaria?Math.min(100,promDia/cfg.metaDiaria*100):0)+'" style="width:'+(cfg.metaDiaria?Math.min(100,promDia/cfg.metaDiaria*100):0).toFixed(1)+'%"></i></div></div>'+
          '<div class="goalrow"><div class="gt"><span>Faltan para la meta total</span><b>'+Math.max(0,cfg.metaTotal-s.all.n)+'</b></div></div>'+
        '</div>'+
      '</div>';

    var metaEq=Math.round(cfg.metaTotal/3);
    var TCOL={"1":"#159BD6","2":"#12925A","3":"#C77D1F"};
    var order=["1","2","3"].slice().sort(function(a,b){return s.teams[b].n-s.teams[a].n;});
    var rankOf={}; order.forEach(function(k,i){ rankOf[k]=i+1; });
    var medal={1:"🥇 1°",2:"🥈 2°",3:"🥉 3°"};
    $("#teams").innerHTML=["1","2","3"].map(function(k){
      var t=s.teams[k], p=metaEq?Math.min(100,t.n/metaEq*100):0;
      var link=baseURL()+"#/e/"+k;
      var rk = s.teams["1"].n+s.teams["2"].n+s.teams["3"].n ? medal[rankOf[k]] : "—";
      return '<div class="tcard" style="--tc:'+TCOL[k]+'">'+
        '<div class="thead-t"><div class="tname">'+esc(eqName(k))+'</div><span class="rankb">'+rk+'</span></div>'+
        '<div class="tbig">'+t.n+' <small>/ '+metaEq+'</small></div>'+
        '<div class="tpct">'+p.toFixed(0)+'% de su meta</div>'+
        '<div class="bar" style="height:12px"><i style="width:'+p.toFixed(1)+'%;background:var(--tc)"></i></div>'+
        '<div class="tstats">'+
          '<div class="tstat"><span>Hoy</span><b>'+t.hoy+'</b></div>'+
          '<div class="tstat"><span>Promedio</span><b>'+(t.n?t.avg.toFixed(1):"—")+'</b></div>'+
          '<div class="tstat"><span>Satisf.</span><b>'+(t.n?pf(t.sat):"—")+'</b></div>'+
        '</div>'+
        '<div class="tlink"><input readonly value="'+esc(link)+'"><button class="lnk" data-cp="'+esc(link)+'">Copiar</button><button class="lnk" data-qr="'+k+'">QR</button></div>'+
        '<div class="qrbox" id="qr'+k+'" hidden></div>'+
      '</div>';
    }).join("");
    $$("#teams [data-cp]").forEach(function(b){
      b.onclick=function(){
        var v=b.dataset.cp;
        (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(function(){
          b.textContent="¡Copiado!"; setTimeout(function(){b.textContent="Copiar";},1500);
        },function(){
          var i=b.previousElementSibling; i.focus(); i.select(); b.textContent="Ctrl+C"; setTimeout(function(){b.textContent="Copiar";},1500);
        });
      };
    });
    $$("#teams [data-qr]").forEach(function(b){
      b.onclick=function(){
        var k=b.dataset.qr, box=$("#qr"+k), url=baseURL()+"#/e/"+k;
        box.hidden=!box.hidden;
        b.textContent=box.hidden?"QR":"Ocultar";
        if(box.hidden) return;
        box.innerHTML="";
        if(window.QRCode){
          new QRCode(box,{text:url, width:300, height:300, correctLevel:QRCode.CorrectLevel.M});
          var cap=document.createElement("div"); cap.className="qcap"; cap.textContent=url; box.appendChild(cap);
        } else {
          var img=document.createElement("img"); img.style.display="block"; img.width=150; img.height=150;
          img.src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="+encodeURIComponent(url);
          box.appendChild(img);
          var c2=document.createElement("div"); c2.className="qcap"; c2.textContent=url; box.appendChild(c2);
        }
      };
    });

    var rb=$("#refreshBtn"); if(rb) rb.textContent="Actualizar";
    var cm=$("#cfgmsg");
    if(cm) cm.textContent = apiState==="error" ? "No hay conexión con el servidor de datos. Revisa la URL del Apps Script o vuelve a intentar."
      : apiState==="demo" ? "Modo demostración: los datos son de este dispositivo. Configura API_URL para la operación real."
      : "Metas actuales: "+cfg.metaTotal+" en total · "+cfg.metaDiaria+"/día. Se editan en la hoja de Google (pestaña Config).";

    updateCharts(s);
    fillTable();
  }

  function fillTable(){
    var tb=$("#tbl tbody"); if(!tb) return;
    var rows=responses.slice().sort(function(a,b){return (b.ts||0)-(a.ts||0);});
    if(panelFilter!=="all") rows=rows.filter(function(r){return String(r.equipo)===panelFilter;});
    rows=rows.slice(0,80);
    if(!rows.length){ tb.innerHTML='<tr><td colspan="5"><div class="empty">Aún no hay respuestas'+(panelFilter!=="all"?" de este equipo":"")+'.</div></td></tr>'; return; }
    tb.innerHTML=rows.map(function(r){
      var dt=r.ts?new Date(r.ts).toLocaleString("es-CO",{timeZone:"America/Bogota",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
      var rt=+r.rating||0;
      return '<tr><td>'+esc(dt)+'</td><td>'+esc(r.cedula||r.id)+'</td><td>'+esc(eqName(r.equipo))+'</td>'+
        '<td>'+(rt?'<span class="chip r'+rt+'">'+rt+' · '+RLAB[rt]+'</span>':'—')+'</td>'+
        '<td>'+esc(r.comentario||"—")+'</td></tr>';
    }).join("");
  }

  /* ---------- charts ---------- */
  function themeColors(){
    var cs=getComputedStyle(document.body);
    return {ink:cs.getPropertyValue("--ink").trim()||"#0D1730",
            muted:cs.getPropertyValue("--muted").trim()||"#5B6A88",
            line:cs.getPropertyValue("--line").trim()||"#E0E6F1",
            cyan:cs.getPropertyValue("--cyan").trim()||"#159BD6",
            navy:cs.getPropertyValue("--navy").trim()||"#0B1F5C"};
  }
  function buildCharts(){
    if(!window.Chart || !$("#cDia")) return;
    var c=themeColors();
    Chart.defaults.font.family='"Public Sans",system-ui,sans-serif';
    Chart.defaults.color=c.muted;
    charts.dia=new Chart($("#cDia"),{type:"bar",data:{labels:[],datasets:[
      {type:"bar",label:"Respuestas",data:[],backgroundColor:c.cyan,borderRadius:4,order:2},
      {type:"line",label:"Meta diaria",data:[],borderColor:c.muted,borderDash:[5,5],pointRadius:0,borderWidth:1.5,order:1}
    ]},options:chartOpts(c,{y:{beginAtZero:true,ticks:{precision:0}}})});
    charts.rate=new Chart($("#cRate"),{type:"bar",data:{labels:["Muy mala","Mala","Regular","Buena","Excelente"],
      datasets:[{label:"Respuestas",data:[],backgroundColor:RAMP.slice(1),borderRadius:4}]},
      options:chartOpts(c,{x:{beginAtZero:true,ticks:{precision:0}}},"y")});
    charts.team=new Chart($("#cTeam"),{type:"doughnut",data:{labels:[],datasets:[{data:[],
      backgroundColor:[c.cyan,c.navy,"#C09220","#9AA6C4"],borderWidth:2,borderColor:getComputedStyle(document.body).getPropertyValue("--card").trim()||"#fff"}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}});
    if(view.name==="panel"&&authed) updateCharts(computeStats());
  }
  function chartOpts(c,scales,indexAxis){
    var o={responsive:true,maintainAspectRatio:false,indexAxis:indexAxis||"x",
      plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:11}}}},
      scales:{x:{grid:{color:c.line},ticks:{font:{size:11}}},y:{grid:{color:c.line},ticks:{font:{size:11}}}}};
    if(scales.x) Object.assign(o.scales.x,scales.x);
    if(scales.y) Object.assign(o.scales.y,scales.y);
    return o;
  }
  function updateCharts(s){
    if(charts.dia){
      charts.dia.data.labels=s.days.map(function(d){return d.d;});
      charts.dia.data.datasets[0].data=s.days.map(function(d){return d.n;});
      charts.dia.data.datasets[1].data=s.days.map(function(){return cfg.metaDiaria;});
      charts.dia.update();
    }
    if(charts.rate){ charts.rate.data.datasets[0].data=s.dist; charts.rate.update(); }
    if(charts.team){
      var lab=[], val=[];
      ["1","2","3"].forEach(function(k){ lab.push(eqName(k)); val.push(s.teams[k].n); });
      if(s.teams["0"].n){ lab.push("Sin equipo"); val.push(s.teams["0"].n); }
      charts.team.data.labels=lab; charts.team.data.datasets[0].data=val; charts.team.update();
    }
  }
  function destroyCharts(){ Object.keys(charts).forEach(function(k){ try{charts[k].destroy();}catch(e){} }); charts={}; }

  /* ---------- exportar CSV ---------- */
  function exportCSV(){
    var rows=[["fecha_hora","documento","equipo","valoracion","etiqueta","comentario"]];
    responses.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0);}).forEach(function(r){
      var dt=r.ts?new Date(r.ts).toLocaleString("es-CO",{timeZone:"America/Bogota"}):(r.fecha||"");
      rows.push([dt, r.cedula, eqName(r.equipo), r.rating||"", RLAB[r.rating]||"", (r.comentario||"")]);
    });
    var csv=String.fromCharCode(0xFEFF)+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\r\n");
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    a.download="respuestas-cultura-setp-"+bogota()+".csv";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
  }
})();
</script>
